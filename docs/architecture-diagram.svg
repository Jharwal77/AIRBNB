<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475467"/>
    </marker>
    <style>
      .box{fill:#ffffff;stroke:#d0d5dd;stroke-width:1.5;rx:10}
      .zone{fill:#f8fafc;stroke:#e4e7ec;stroke-width:1;rx:14}
      .t{font-size:15px;font-weight:700;fill:#101828}
      .s{font-size:12px;fill:#475467}
      .xs{font-size:11px;fill:#667085}
      .zone-t{font-size:12px;font-weight:700;fill:#667085;letter-spacing:1.2px}
      .chip{fill:#eef2ff;stroke:#c7d2fe;rx:6}
      .chip-g{fill:#ecfdf5;stroke:#a7f3d0;rx:6}
      .chip-p{fill:#fff4ed;stroke:#fed7aa;rx:6}
      .chip-t{font-size:11px;fill:#3538cd}
      .chip-gt{font-size:11px;fill:#067647}
      .chip-pt{font-size:11px;fill:#b93815}
      .edge{stroke:#475467;stroke-width:1.6;fill:none;marker-end:url(#ar)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1600" height="1080" fill="#ffffff"/>
  <text x="60" y="52" font-size="24" font-weight="700" fill="#101828">Vacation-Rental Marketplace (Airbnb-scale) - Production Architecture</text>
  <text x="60" y="76" class="s">React SPA frontend + Node/Express REST backend, MongoDB persistence, CDN-edge media, cache-aside reads, queue-based write levelling, region-sharded search</text>

  <rect x="40" y="100" width="1520" height="110" class="zone"/>
  <text x="60" y="126" class="zone-t">CLIENTS</text>
  <rect x="70" y="140" width="300" height="52" class="box"/>
  <text x="86" y="162" class="t">Web - React SPA (Vite)</text>
  <text x="86" y="180" class="s">Context API state, Axios API layer, Tailwind UI</text>
  <rect x="400" y="140" width="260" height="52" class="box"/>
  <text x="416" y="162" class="t">Mobile Web / PWA</text>
  <text x="416" y="180" class="s">same SPA, responsive shells</text>
  <rect x="690" y="140" width="260" height="52" class="box"/>
  <text x="706" y="162" class="t">Host / Admin Consoles</text>
  <text x="706" y="180" class="s">RBAC-gated dashboards</text>
  <rect x="980" y="140" width="260" height="52" class="box"/>
  <text x="996" y="162" class="t">Partner Webhooks</text>
  <text x="996" y="180" class="s">payments, channel managers</text>

  <rect x="40" y="240" width="1520" height="120" class="zone"/>
  <text x="60" y="266" class="zone-t">EDGE / DELIVERY</text>
  <rect x="70" y="282" width="420" height="58" class="box"/>
  <text x="86" y="305" class="t">CDN + WAF (Cloudflare / Vercel Edge)</text>
  <text x="86" y="324" class="s">TLS, DDoS, bot filtering, HTML/asset cache, geo routing</text>
  <rect x="520" y="282" width="380" height="58" class="box"/>
  <text x="536" y="305" class="t">Image CDN (Cloudinary / S3 + CDN)</text>
  <text x="536" y="324" class="s">on-the-fly transforms, AVIF/WebP, signed uploads</text>
  <rect x="930" y="282" width="310" height="58" class="box"/>
  <text x="946" y="305" class="t">Static SPA Hosting (Vercel)</text>
  <text x="946" y="324" class="s">immutable bundles, preview envs per PR</text>

  <rect x="40" y="390" width="1520" height="150" class="zone"/>
  <text x="60" y="416" class="zone-t">API TIER (stateless, horizontally scaled)</text>
  <rect x="70" y="432" width="250" height="86" class="box"/>
  <text x="86" y="456" class="t">Load Balancer / Ingress</text>
  <text x="86" y="476" class="s">L7, TLS termination,</text>
  <text x="86" y="492" class="s">sticky-less round robin</text>
  <rect x="360" y="432" width="560" height="86" class="box"/>
  <text x="376" y="456" class="t">Node.js / Express API cluster (K8s + HPA)</text>
  <text x="376" y="476" class="s">MVC: thin controllers over services - listings, search, booking, reviews, auth</text>
  <rect x="376" y="486" width="120" height="22" class="chip"/><text x="386" y="501" class="chip-t">REST /api/v1</text>
  <rect x="504" y="486" width="120" height="22" class="chip"/><text x="514" y="501" class="chip-t">JWT + RBAC</text>
  <rect x="632" y="486" width="130" height="22" class="chip"/><text x="642" y="501" class="chip-t">rate limiting</text>
  <rect x="770" y="486" width="130" height="22" class="chip"/><text x="780" y="501" class="chip-t">SSE / webhooks</text>
  <rect x="960" y="432" width="280" height="86" class="box"/>
  <text x="976" y="456" class="t">Redis (cache-aside)</text>
  <text x="976" y="476" class="s">hot listing cards, AI results,</text>
  <text x="976" y="492" class="s">session + rate-limit counters</text>
  <rect x="1280" y="432" width="250" height="86" class="box"/>
  <text x="1296" y="456" class="t">Autoscaler (HPA/VPA)</text>
  <text x="1296" y="476" class="s">CPU + RPS targets,</text>
  <text x="1296" y="492" class="s">scale-to-zero previews</text>

  <rect x="40" y="570" width="1520" height="150" class="zone"/>
  <text x="60" y="596" class="zone-t">DATA TIER</text>
  <rect x="70" y="612" width="400" height="86" class="box"/>
  <text x="86" y="636" class="t">MongoDB Atlas (Mongoose)</text>
  <text x="86" y="656" class="s">listings, reviews, reservations - primary + read replicas,</text>
  <text x="86" y="672" class="s">zone-sharded clusters, unique constraints (idempotency)</text>
  <rect x="500" y="612" width="330" height="86" class="box"/>
  <text x="516" y="636" class="t">Search Cluster (Elasticsearch)</text>
  <text x="516" y="656" class="s">geo + faceted search, synonym maps,</text>
  <text x="516" y="672" class="s">CDC-synced from Mongo change streams</text>
  <rect x="860" y="612" width="300" height="86" class="box"/>
  <text x="876" y="636" class="t">Object Storage (S3)</text>
  <text x="876" y="656" class="s">original media, validated uploads,</text>
  <text x="876" y="672" class="s">lifecycle to cold tier</text>
  <rect x="1190" y="612" width="340" height="86" class="box"/>
  <text x="1206" y="636" class="t">Analytics Warehouse (BigQuery)</text>
  <text x="1206" y="656" class="s">event stream sink: searches, views,</text>
  <text x="1206" y="672" class="s">conversion - feeds ranking + pricing ML</text>

  <rect x="40" y="750" width="1520" height="120" class="zone"/>
  <text x="60" y="776" class="zone-t">ASYNC / EVENT TIER (write levelling)</text>
  <rect x="70" y="792" width="280" height="58" class="box"/>
  <text x="86" y="815" class="t">Message Bus (SQS / Kafka)</text>
  <text x="86" y="834" class="s">booking spikes, fan-out events</text>
  <rect x="390" y="792" width="250" height="58" class="box"/>
  <text x="406" y="815" class="t">Workers: booking + email</text>
  <text x="406" y="834" class="s">idempotent consumers, retries/DLQ</text>
  <rect x="670" y="792" width="250" height="58" class="box"/>
  <text x="686" y="815" class="t">Media pipeline workers</text>
  <text x="686" y="834" class="s">validate, transcode, thumb-nail</text>
  <rect x="950" y="792" width="250" height="58" class="box"/>
  <text x="966" y="815" class="t">Search index sync worker</text>
  <text x="966" y="834" class="s">change-stream consumer</text>
  <rect x="1230" y="792" width="300" height="58" class="box"/>
  <text x="1246" y="815" class="t">Webhook gateway (idempotent)</text>
  <text x="1246" y="834" class="s">unique event index, replay-safe</text>

  <rect x="40" y="900" width="1520" height="140" class="zone"/>
  <text x="60" y="926" class="zone-t">CROSS-CUTTING</text>
  <rect x="70" y="942" width="340" height="76" class="box"/>
  <text x="86" y="966" class="t">CI/CD - GitHub Actions</text>
  <text x="86" y="986" class="s">lint/test/build - Vercel (web) + Railway/K8s (api)</text>
  <text x="86" y="1002" class="s">canary deploys, auto rollback</text>
  <rect x="440" y="942" width="340" height="76" class="box"/>
  <text x="456" y="966" class="t">Observability</text>
  <text x="456" y="986" class="s">Prometheus + Grafana, Sentry, OTel traces,</text>
  <text x="456" y="1002" class="s">/api/v1/health synthetic probes</text>
  <rect x="810" y="942" width="340" height="76" class="box"/>
  <text x="826" y="966" class="t">Security &amp; Secrets</text>
  <text x="826" y="986" class="s">Helmet, strict CORS, bcrypt, JWT rotation, OAuth,</text>
  <text x="826" y="1002" class="s">vault-managed .env, dependency audits</text>
  <rect x="1180" y="942" width="350" height="76" class="box"/>
  <text x="1196" y="966" class="t">IaC &amp; DR</text>
  <text x="1196" y="986" class="s">Terraform modules, multi-region failover,</text>
  <text x="1196" y="1002" class="s">PITR backups, chaos + load drills</text>

  <path class="edge" d="M220 192 V282"/>
  <path class="edge" d="M530 192 V282"/>
  <path class="edge" d="M820 192 V282"/>
  <path class="edge" d="M280 340 V432"/>
  <text x="292" y="392" class="xs">HTML/JS from edge, API over HTTPS</text>
  <path class="edge" d="M320 475 H360"/>
  <path class="edge" d="M920 475 H960"/>
  <path class="edge" d="M560 518 V612"/>
  <text x="572" y="572" class="xs">reads/writes (transactions)</text>
  <path class="edge" d="M700 518 V612"/>
  <text x="712" y="572" class="xs">search queries</text>
  <path class="edge dash" d="M1010 518 V612"/>
  <text x="1022" y="572" class="xs">media URLs</text>
  <path class="edge" d="M620 698 V792"/>
  <text x="632" y="752" class="xs">change streams</text>
  <path class="edge" d="M350 821 H390"/>
  <path class="edge" d="M640 821 H670"/>
  <path class="edge" d="M920 821 H950"/>
  <path class="edge dash" d="M480 792 V698"/>
  <text x="330" y="745" class="xs">events</text>
</svg>
