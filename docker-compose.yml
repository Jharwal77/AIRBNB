services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
  api:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/airbnb_clone
      CLIENT_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    command: sh -c "node src/seed/seed.js || true; node src/server.js"
  web:
    build: ./frontend
    restart: unless-stopped
    environment:
      VITE_API_ORIGIN: ""
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mongo_data:
